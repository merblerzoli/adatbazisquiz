<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adatbáziskezelés Interaktív Kvíz</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">
<div class="w-full max-w-2xl bg-slate-900 border border-slate-800 rounded-2xl shadow-xl p-6 md:p-8">
  <div class="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
    <h1 class="text-xl md:text-2xl font-bold text-indigo-400">Adatbáziskezelés ZH Kvíz</h1>
    <span id="counter" class="text-sm bg-slate-800 text-slate-300 px-3 py-1 rounded-full font-medium"></span>
  </div>

  <div id="quiz">
    <div id="qt" class="text-lg md:text-xl font-semibold mb-2 text-slate-200"></div>
    <div id="hint" class="hidden text-sm text-amber-300 mb-4">Több jó válasz is lehet – jelöld be mindet, majd kattints az Ellenőrzésre.</div>
    <div id="opts" class="space-y-3 mb-6 mt-4"></div>
    <div id="fb" class="hidden mb-6 p-4 rounded-xl text-sm font-medium"></div>
    <div class="flex justify-between items-center gap-2">
      <button id="prev" onclick="go(-1)" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl font-medium transition disabled:opacity-50 disabled:cursor-not-allowed">Előző</button>
      <button id="check" onclick="submit()" class="hidden px-6 py-2 bg-amber-600 hover:bg-amber-500 text-white rounded-xl font-medium transition disabled:opacity-50 disabled:cursor-not-allowed">Ellenőrzés</button>
      <button id="next" onclick="go(1)" class="hidden px-6 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-medium transition">Következő</button>
    </div>
  </div>

  <div id="result" class="hidden text-center py-8">
    <h2 class="text-3xl font-bold text-indigo-400 mb-4">Kvíz vége!</h2>
    <p id="score" class="text-xl mb-6 text-slate-300"></p>
    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <button onclick="start(false)" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-semibold transition">Újrakezdés</button>
      <button onclick="start(true)" class="px-6 py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl font-semibold transition">Újrakezdés kevert sorrendben</button>
    </div>
  </div>
</div>

<script>
// [kérdés, [válaszok], helyes index vagy indexek tömbje]
const D = [
["Az adatbázis séma leírására alkalmas:",["HLL","DML","DDL","DCL"],2],
["A táblák közötti kapcsolat megvalósításához használt kulcsot ... nevezzük",["Elsődleges kulcs","Másodlagos kulcs","Idegen kulcs","A fentiek egyike sem"],2],
["Az ......... az, hogy a táblázatnak egynél több attribútumkészlete van, amelyet kulcsként lehet kiválasztani",["idegen kulcs","integritás kulcs","kapcsolat","alternatív kulcs"],3],
["A többértékű függőség esetén:",["az egyik attribútumhoz egy másik attribútum csoportja, halmaza kapcsolódik","az egyik attribútumhoz több attribútum kapcsolódik","egy attribútumhalmazhoz egy másik attribútumhalmaz kapcsolódik","egyik sem"],0],
["Mi nem igaz a relációkra?",["oszlopok sorrendje tetszőleges","a sorok felcserélhetők","sorok és oszlopok felcserélhetők","az oszlopszélesség soronként változhat"],[2,3]],
["Melyik megfeleltetés hibás?",["tulajdonságtípus ⇔ oszlop","egyedtípus ⇔ sor","tulajdonság előfordulás ⇔ elem","tábla ⇔ egyedtípus"],1],
["Melyek csoportosítással kapcsolatos elemek az SQL-ben?",["WHERE","HAVING","UPDATE","GROUP BY"],[1,3]],
["Mi tartozik az adatbázis szerkezeti változtatásához?",["tábla törlése","új sor bevitele","a mező értékének módosítása","új oszlop(ok) beillesztése"],[0,3]],
["Mi nem tartozik az adatbázis szerkezeti változtatásához?",["új sor bevitele","új oszlop(ok) beillesztése","tábla törlése","a mező értékének módosítása"],[0,3]],
["........ bevezette a relációs adatbázis szabályait.",["Atul Kahate","James Gossling","E. F. Codd","Dennis Ritchie"],2],
["Mit kell a kérdőjelek helyére: UPDATE tanulo ?????? kor = kor + 1;",["Nem kell semmi","TO","SET","WHERE"],2],
["Mi az ami(k) SQL parancsokkal nem valósítható(k) meg?",["Több tábla egyidejű kezelése","Ciklus szervezés","Sorok szűrése","Oszlopok kiválasztása"],1],
["Melyik paranccsal lehet adatbázist törölni?",["DELETE DATABASE","DROP DATABASE","CANCEL DATABASE","KILL DATABASE"],1],
["Adott a Tanulo(az, nev, kor, megjegyzes) séma. Helyes-e az INSERT INTO Tanulo('12345','Szép Anna',14,null); parancs?",["Igen","Nem"],1],
["Hogyan írnánk azokat a tanulókat, akiknek a születési helye nincs rögzítve?",["SELECT * FROM tanulo WHERE szulhely='';","SELECT * FROM tanulo WHERE szulhely=NULL;","SELECT * FROM tanulo WHERE szulhely=EMPTY;","SELECT * FROM tanulo WHERE szulhely IS NULL;","SELECT * FROM tanulo WHERE szulhely LIKE '';"],3],
["A ........... arra utal, hogy az adatok milyen módon vannak elrendezve és hozzáférhetők a DBMS-ből.",["adatbázis-hierarchia","adatszervezés","adatmegosztás","adatmodell"],3],
["A táblázat oszlopok kiválasztásának művelete, amelyet ........ végez.",["Szelekció","Projekció","Unió","Osztás"],1],
["A táblázat sorok kiválasztásának művelete, amelyet ........ végez.",["Szelekció","Projekció","Unió","Osztás"],0],
["Az adatbázisban egy adott pillanatban tárolt információk összességét ...... -nek nevezzük.",["séma","az adatbázis példánya","adattartomány","reláció"],1],
["A táblázat oszlopértékének megváltoztatásához a ........ parancs használható.",["Create","Insert","Alter","Update","egyik sem"],3],
["Adatok között akkor áll fenn funkcionális kapcsolat...",["ha redundancia található","ha egy vagy több adat konkrét értékéből más adatok egyértelműen következnek","ha inkonzisztencia van köztük","egyik sem"],1],
["Teljes funkcionális függőségről akkor beszélünk,",["ha a függőség mindkét oldalán több attribútum áll","ha a függőség mindkét oldalán csak egy attribútum áll","ha a meghatározó oldalon nincsen felesleges attribútum","ha a meghatározó oldalon van felesleges attribútum","egyik sem"],2],
["Mit jelent a funkcionális függés?",["egy elem csak egy értéket vehet fel","egy tulajdonság bármely értéket felvehet","az azonosítóhoz a tulajdonság csak egy értéke rendelhető","az azonosító értéke függ a tulajdonsághalmaztól"],2],
["........ kritikus jelentőségű az adatbázis-tervezés megfogalmazásában.",["A sor/oszlopok sorrendje","A táblázatok száma","A funkcionális függőség","Az attribútumok száma"],2],
["Melyik követelmény igaz a kapcsoló tulajdonságokra?",["A két egyedben azonos nevű legyen","Csak erősen jellemző tulajdonság lehet","Az egyik egyedben azonosító legyen","A két táblában azonos típusú legyen"],[2,3]],
["Egy reláció első normálformában van, ha:",["minden tulajdonságot csak az azonosító határoz meg","minden tulajdonság funkcionálisan független az azonosítótól","határozott és részleges függés van benne","csak tranzitív függés van benne"],0],
["Az olyan tulajdonság az egyeden belül, amely nem minden sorban vesz fel értéket:",["alternatív azonosító","gyengén jellemző","azonosító","logikailag gyengén redundáns"],1],
["Az olyan tulajdonság, amely minden egyed előfordulásban vesz fel értéket:",["funkcionálisan független","erősen jellemző","kapcsoló","gyengén jellemző"],1],
["Az olyan tulajdonság az egyeden belül, amelynek bármely előfordulása egy és csakis egy sort jellemez:",["funkcionálisan független","azonosító","kapcsoló","leíró"],1],
["Az olyan tulajdonság az egyeden belül, amelynek bármely előfordulása több sort is jellemezhet:",["kapcsoló","leíró","azonosító","erősen jellemző"],1],
["Mi nem lehet azonosító?",["gyengén jellemző tulajdonság","csak betűket tartalmazó kód","12 jelnél többet tartalmazó kód","kapcsoló tulajdonság"],[0,3]],
["Mi nem lehet egyszerű azonosító a munkaügyi rendszerben?",["dolgozó törzsszáma","ledolgozott napok száma","szervezeti egység kód","nyelvvizsga dátuma"],[1,3]],
["Mi a leglényegesebb következménye az erős logikai redundanciának?",["kapcsolat","az inkonzisztencia veszélye","alternatív függés","felesleges tárfoglalás"],1],
["A normalizálás során alkalmazott legfontosabb művelet:",["szelekció","unió","projekció","join"],2],
["Egy táblának csak egy lehet:",["Másodlagos kulcs","Alternatív kulcs","Egyedi kulcs","Elsődleges kulcs"],3],
["A ........ táblák, indexek és egyéb struktúrák létrehozására és megsemmisítésére szolgál.",["az adatkezelés nyelve","adat-ellenőrzési nyelv","tranzakció-ellenőrzési nyelv","adatmeghatározási nyelv"],3],
["Az alábbiak közül melyik jellemzi az entitásokat?",["Csoportok","Táblázat","Attribútumok","Kulcsok"],2],
["Mit jelent a GROUP BY?",["a soroknak egy kulcsmező azonos értékei szerinti csoportosítása","csoportos adatbevitel","a lapváltás beállítása","a soroknak meghatározott összetett feltétel szerinti kiválasztása"],0],
["Melyik nem SQL utasítás(ok)?",["SELECT név FROM dolgozó;","IF bér<10000 THEN bér=bér*1.2;","CREATE DATABASE bér;","DROP TABLE szakma;"],1],
["Az SQL-ben a „NATURAL” szó használható",["belső kapcsolat esetén","a teljes külső kapcsolat esetén","a jobb külső kapcsolat esetén","az összes fentiek esetén"],3],
["Az E-R diagramban az általánosítást a ... jelöli.",["ellipszis","háromszög","téglalap","egyik sem"],3],
["Melyik cég dolgozta ki az SQL lekérdező nyelvet?",["Microsoft","Corel","Apple","IBM"],3]
];

const $ = id => document.getElementById(id);
const same = (a, b) => a.length === b.length && a.every(x => b.includes(x));
let Q = [], cur = 0, ans = [], sel = [];

function start(shuffle) {
  Q = D.map(([q, o, a]) => ({ q, o, a: [].concat(a) }));
  if (shuffle) Q.sort(() => Math.random() - 0.5);
  cur = 0; sel = []; ans = Q.map(() => null);
  $("quiz").classList.remove("hidden");
  $("result").classList.add("hidden");
  load();
}

function load() {
  const q = Q[cur], done = ans[cur] !== null, multi = q.a.length > 1;
  const chosen = done ? ans[cur] : sel;
  $("counter").textContent = `Kérdés: ${cur + 1} / ${Q.length}`;
  $("qt").textContent = q.q;
  $("hint").classList.toggle("hidden", !multi);
  $("opts").innerHTML = "";
  q.o.forEach((t, i) => {
    const b = document.createElement("button"), c = chosen.includes(i), ok = q.a.includes(i);
    let cls = "border-slate-700/60 bg-slate-800/60 hover:bg-slate-800 text-slate-200";
    if (done) cls = ok ? "border-emerald-600/50 bg-emerald-950/40 text-emerald-200"
      : c ? "border-rose-600/50 bg-rose-950/40 text-rose-200"
      : "border-slate-800 bg-slate-800/40 text-slate-400";
    else if (c) cls = "border-indigo-500 bg-indigo-950/50 text-indigo-200";
    b.className = "w-full text-left p-4 rounded-xl border transition font-medium " + cls;
    b.textContent = (multi ? (c ? "☑ " : "☐ ") : "") + t;
    if (done) b.disabled = true; else b.onclick = () => pick(i);
    $("opts").appendChild(b);
  });
  const fb = $("fb");
  if (done) {
    const good = same(ans[cur], q.a);
    fb.className = "mb-6 p-4 rounded-xl text-sm font-medium border " + (good
      ? "bg-emerald-950/60 border-emerald-600/50 text-emerald-300"
      : "bg-rose-950/60 border-rose-600/50 text-rose-300");
    fb.textContent = good ? "Helyes válasz!"
      : `Helytelen. A helyes válasz: ${q.a.map(i => `"${q.o[i]}"`).join(" + ")}`;
  } else fb.className = "hidden";
  $("prev").disabled = cur === 0;
  $("check").classList.toggle("hidden", !(multi && !done));
  $("check").disabled = sel.length === 0;
  $("next").classList.toggle("hidden", !done);
  $("next").textContent = cur === Q.length - 1 ? "Eredmény" : "Következő";
}

function pick(i) {
  if (Q[cur].a.length > 1) {
    sel = sel.includes(i) ? sel.filter(x => x !== i) : [...sel, i];
    load();
  } else { sel = [i]; submit(); }
}

function submit() { ans[cur] = sel.slice(); sel = []; load(); }

function go(d) {
  sel = [];
  if (cur + d >= Q.length) return showResults();
  cur = Math.max(0, cur + d);
  load();
}

function showResults() {
  const s = Q.filter((q, i) => ans[i] && same(ans[i], q.a)).length;
  $("quiz").classList.add("hidden");
  $("result").classList.remove("hidden");
  $("score").textContent = `A pontszámod: ${s} / ${Q.length} (${Math.round(100 * s / Q.length)}%)`;
}

start(false);
</script>
</body>
</html>
